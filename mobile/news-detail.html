    <script>
    (function(){
        var xhr=new XMLHttpRequest();
        xhr.open('GET','../admin/api/fetch-logo.php?t='+Date.now(),true);
        xhr.onload=function(){
            if(xhr.status>=200&&xhr.status<400){
                try{
                    var resp=JSON.parse(xhr.responseText);
                    if(resp.code===0&&resp.data){
                        function fixSubDir(p){return p&&p.indexOf('http')!==0?'../'+(p.charAt(0)==='/'?p.substring(1):p):p;}
                        if(resp.data.header_logo){
                            var hl=document.querySelector('.logo img');
                            if(hl)hl.src=fixSubDir(resp.data.header_logo);
                        }
                        if(resp.data.footer_logo){
                            var fl=document.querySelector('.footer-logo img');
                            if(fl)fl.src=fixSubDir(resp.data.footer_logo);
                        }
                        if(resp.data.favicon){
                            var lk=document.querySelector('link[rel="icon"]')||document.querySelector('link[rel="shortcut icon"]');
                            if(!lk){lk=document.createElement('link');lk.rel='icon';document.head.appendChild(lk);}
                            lk.href=fixSubDir(resp.data.favicon);
                        }
                    }
                }catch(e){}
            }
        };
        xhr.send();
    })();
    </script>

    <script>
        // 从localStorage加载文章
        function loadArticleFromStorage(articleId) {
            const articles = JSON.parse(localStorage.getItem('cms_articles') || '[]');
            // 支持字符串和数字ID比较，确保类型一致
            return articles.find(a => String(a.id) === String(articleId));
        }
        
        // 获取所有已发布文章
        function getAllPublishedArticles() {
            const articles = JSON.parse(localStorage.getItem('cms_articles') || '[]');
            return articles.filter(a => a.status === 'published').sort((a, b) => {
                const dateA = new Date(a.publishDate || a.created_at || 0);
                const dateB = new Date(b.publishDate || b.created_at || 0);
                return dateB - dateA;
            });
        }
        
        // 渲染文章头部
        function renderArticleHeader(article) {
            const category = article.category || '行业资讯';
            const title = article.title || '无标题';
            const date = article.publishDate || article.created_at || new Date().toISOString();
            const formattedDate = new Date(date).toLocaleDateString('zh-CN');
            const author = article.author || 'Yao资金网';
            
            document.getElementById('articleHeader').innerHTML = `
                <a href="news.php" class="article-back-btn-top">
                    <i class="fas fa-arrow-left"></i>
                    返回资讯列表
                </a>
                <h1 class="article-detail-title">${title}</h1>
                <div class="article-detail-meta">
                    <span><i class="far fa-calendar"></i> ${formattedDate}</span>
                    <span><i class="far fa-user"></i> ${author}</span>
                    <span><i class="far fa-eye"></i> ${article.views || 0} 阅读</span>
                </div>
            `;
        }
        
        // 验证图片数据是否有效
        function isValidImage(imageData) {
            if (!imageData) return false;
            if (typeof imageData !== 'string') return false;
            // 检查是否是有效的Base64图片
            if (imageData.startsWith('data:image')) {
                // 检查Base64数据是否完整（至少要有头部和一部分数据）
                return imageData.length > 100;
            }
            // 检查是否是有效的URL
            if (imageData.startsWith('http://') || imageData.startsWith('https://') || imageData.startsWith('/')) {
                return imageData.length > 10;
            }
            // 检查是否是相对路径
            if (imageData.startsWith('images/') || imageData.startsWith('uploads/')) {
                return true;
            }
            return false;
        }

        // 获取有效的封面图片
        function getValidCoverImage(article) {
            // 如果有封面图，使用封面图（加上../前缀）
            if (article.cover_image && isValidImage(article.cover_image)) {
                return '../' + article.cover_image;
            }
            // 如果没有封面图，返回 null（不显示封面图）
            return null;
        }

        // 渲染文章内容
        function renderArticleContent(article) {
            const content = article.content || '<p>暂无内容</p>';
            const tags = article.tags || [];
            
            let tagsHtml = '';
            if (tags.length > 0) {
                tagsHtml = `
                    <div class="article-tags">
                        ${tags.map(tag => `<span class="article-tag">${tag}</span>`).join('')}
                    </div>
                `;
            }
            
            // 文章详情页不显示封面图（老板要求）
            document.getElementById('articleContent').innerHTML = `
                <div class="article-detail-main">
                    <div class="article-body">
                        ${content}
                    </div>
                    ${tagsHtml}
                    <div class="article-share-full">
                        <div class="share-left">
                            <span class="share-title">分享到：</span>
                            <div class="share-buttons">
                                <button class="share-btn wechat" id="mShareBtnWechat" title="微信"><i class="fab fa-weixin"></i></button>
                                <button class="share-btn wechat-moments" id="mShareBtnMoments" title="朋友圈"><i class="fas fa-users"></i></button>
                                <button class="share-btn qq" id="mShareBtnQQ" title="QQ"><i class="fab fa-qq"></i></button>
                                <button class="share-btn weibo" id="mShareBtnWeibo" title="微博"><i class="fab fa-weibo"></i></button>
                                <button class="share-btn copy" id="mShareBtnCopy" title="复制链接"><i class="fas fa-link"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 绑定分享按钮事件
            setTimeout(function() {
                var url = window.location.href.split('#')[0];
                var titleEl = document.querySelector('h1.article-detail-title');
                var title = titleEl ? titleEl.textContent.trim() : document.title;
                var u = encodeURIComponent(url);
                var t = encodeURIComponent(title);
                var wechatBtn = document.getElementById('mShareBtnWechat');
                var momentsBtn = document.getElementById('mShareBtnMoments');
                var qqBtn = document.getElementById('mShareBtnQQ');
                var weiboBtn = document.getElementById('mShareBtnWeibo');
                var copyBtn = document.getElementById('mShareBtnCopy');
                if (wechatBtn) wechatBtn.onclick = function(){ openWechatShare(url); };
                if (momentsBtn) momentsBtn.onclick = function(){ openWechatShare(url); };
                if (qqBtn) qqBtn.onclick = function(){ window.open('https://connect.qq.com/widget/shareqq/index.html?url=' + u + '&title=' + t, '_blank', 'width=680,height=520'); };
                if (weiboBtn) weiboBtn.onclick = function(){ window.open('https://service.weibo.com/share/share.php?url=' + u + '&title=' + t, '_blank', 'width=680,height=520'); };
                if (copyBtn) copyBtn.onclick = function(){ copyLink(url, this); };
            }, 100);
        }
        
        // 渲染相关文章
        function renderRelatedArticles(currentArticleId, allArticles) {
            // 排除当前文章，取前4篇
            const relatedArticles = allArticles
                .filter(a => a.id !== currentArticleId)
                .slice(0, 4);
            
            if (relatedArticles.length === 0) {
                document.getElementById('relatedArticles').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: #9ca3af; padding: 40px;">
                        暂无相关资讯
                    </div>
                `;
                return;
            }
            
            document.getElementById('relatedArticles').innerHTML = relatedArticles.map(article => {
                const title = article.title || '无标题';
                const date = article.publishDate || article.created_at || new Date().toISOString();
                const formattedDate = new Date(date).toLocaleDateString('zh-CN');
                const coverImage = getValidCoverImage(article);
                
                // 根据是否有封面图生成不同的HTML
                const thumbHtml = coverImage 
                    ? `<div class="related-article-thumb"><img src="${coverImage}" alt="${title}" loading="lazy"></div>`
                    : `<div class="related-article-thumb placeholder"><div class="placeholder-bg"></div></div>`;
                
                return `
                    <a href="news-detail.html?id=${article.id}" class="related-article-card">
                        ${thumbHtml}
                        <div class="related-article-content">
                            <h3 class="related-article-title">${title}</h3>
                            <span class="related-article-date">${formattedDate}</span>
                        </div>
                    </a>
                `;
            }).join('');
        }
        
        // 渲染未找到文章
        function renderNotFound() {
            document.getElementById('articleHeader').innerHTML = '';
            document.getElementById('articleContent').innerHTML = `
                <div class="article-not-found">
                    <i class="far fa-file-alt"></i>
                    <h2>文章未找到</h2>
                    <p>抱歉，您访问的文章不存在或已被删除</p>
                    <a href="news.php" class="btn">
                        <i class="fas fa-arrow-left"></i>
                        返回资讯列表
                    </a>
                </div>
            `;
        }
        
        // 增加阅读数
        function incrementViews(articleId) {
            const articles = JSON.parse(localStorage.getItem('cms_articles') || '[]');
            // 支持字符串和数字ID比较
            const articleIndex = articles.findIndex(a => String(a.id) === String(articleId));
            
            if (articleIndex !== -1) {
                articles[articleIndex].views = (articles[articleIndex].views || 0) + 1;
                localStorage.setItem('cms_articles', JSON.stringify(articles));
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                renderNotFound();
                return;
            }

            // 从API加载文章数据（替代废弃的localStorage缓存）
            fetch('../mobile/api/news.php?t=' + Date.now(), {method:'GET',cache:'no-store'})
                .then(function(r){ return r.json(); })
                .then(function(result){
                    if(!result.success || !result.data || !result.data.news){
                        renderNotFound(); return;
                    }
                    var articles = result.data.news;
                    var article = null;
                    for(var i=0;i<articles.length;i++){
                        if(String(articles[i].id) === String(articleId)){
                            article = articles[i]; break;
                        }
                    }
                    if(!article){
                        renderNotFound(); return;
                    }
                    document.title = (article.title||'') + ' - Yao资金网';
                    renderArticleHeader(article);
                    renderArticleContent(article);
                    renderRelatedArticles(articleId, articles);
                    incrementViews(articleId);
                })
                ['catch'](function(e){
                    console.error('API load failed:', e);
                    renderNotFound();
                });
        });
        
        // 从API加载页脚数据
        (function(){
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '../admin/api/footer-data.php?t=' + Date.now(), true);
            xhr.onload = function(){
                if(xhr.status >= 200 && xhr.status < 400){
                    try{
                        var resp = JSON.parse(xhr.responseText);
                        if(resp.code === 0 && resp.data && resp.grouped){
                            var bottom = resp.grouped['bottom'] || [];
                            var copyright = '', disclaimer = '';
                            for(var i = 0; i < bottom.length; i++){
                                if(bottom[i].item_key === 'copyright_text'){
                                    copyright = bottom[i].item_value || '';
                                } else if(bottom[i].item_key === 'disclaimer_text'){
                                    disclaimer = bottom[i].item_value || '';
                                }
                            }
                            if(copyright){
                                var el = document.getElementById('footerCopyright');
                                if(el) el.innerHTML = copyright;
                            }
                            if(disclaimer){
                                var el = document.getElementById('footerDisclaimer');
                                if(el) el.innerHTML = disclaimer;
                            }
                        }
                    }catch(e){}
                }
            };
            xhr.send();
        })();</script>

<script>
(function() {
    // Ĭ�ϵ�����Ŀ - APIʧ��ʱʹ��
    var defaultNavItems = [
        { id: '1', name: '首页', url: 'index.html', icon: 'fas fa-home' },
        { id: '2', name: '业务范围', url: 'services.html', icon: 'fas fa-briefcase' },
        { id: '3', name: '成功案例', url: 'cases.html', icon: 'fas fa-trophy' },
        { id: '4', name: '服务优势', url: 'advantages.html', icon: 'fas fa-star' },
        { id: '5', name: '行业资讯', url: 'news.php', icon: 'fas fa-newspaper' },
        { id: '6', name: '常见问题', url: 'faq.html', icon: 'fas fa-question-circle' },
        { id: '7', name: '联系我们', url: 'contact.html', icon: 'fas fa-phone' }
    ];

    function renderNav(items) {
        var container = document.getElementById('dynamicNavMenu');
        if (!container) return;
        var currentPage = window.location.pathname.split('/').pop() || 'index.html';
        var isMobile = window.location.pathname.indexOf('/mobile/') === 0;
        container.innerHTML = items.map(function(item) {
            var url = item.url;
            if (isMobile && url.indexOf('/') === 0) {
                url = url === '/' ? 'index.html' : url.substring(1);
            }
            var isActive = url === currentPage || (currentPage === '' && url === 'index.html');
            return '<li role="none"><a href="' + url + '" class="nav-link' + (isActive ? ' active' : '') + '" role="menuitem">' + item.name + '</a></li>';
        }).join('');
        try { localStorage.setItem('cms_nav_items', JSON.stringify(items)); } catch(e) {}
    }

    // 1. 先从数据库加载
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '../admin/api/nav-save.php?type=nav&t=' + Date.now(), true);
    xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
            try {
                var resp = JSON.parse(xhr.responseText);
                if (resp.code === 0 && resp.data && resp.data.length > 0) {
                    renderNav(resp.data);
                    return;
                }
            } catch(e) {}
        }
        loadFromLocal();
    };
    xhr.onerror = function() { loadFromLocal(); };
    xhr.send();

    function loadFromLocal() {
        try {
            var stored = localStorage.getItem('cms_nav_items');
            if (stored) {
                var parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    renderNav(parsed);
                    return;
                }
            }
        } catch(e) {}
        renderNav(defaultNavItems);
    }
})();
</script>
