<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="100%" style="stop-color:#1d4ed8" />
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#10b981" />
      <stop offset="100%" style="stop-color:#059669" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Stock chart -->
  <polyline points="150,450 250,400 350,420 450,300 500,320 600,220 700,250 800,180 900,200 1000,120 1050,140"
    fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="8,4"/>
  <polyline points="150,420 250,380 350,390 450,280 500,290 600,200 700,230 800,160 900,170 1000,100 1050,110"
    fill="none" stroke="#3b82f6" stroke-width="4"/>
  <!-- Bars -->
  <rect x="200" y="300" width="30" height="200" rx="3" fill="url(#bar1)" opacity="0.6"/>
  <rect x="260" y="270" width="30" height="230" rx="3" fill="url(#bar2)" opacity="0.6"/>
  <rect x="320" y="310" width="30" height="190" rx="3" fill="url(#bar1)" opacity="0.6"/>
  <rect x="650" y="250" width="30" height="250" rx="3" fill="url(#bar2)" opacity="0.6"/>
  <rect x="710" y="280" width="30" height="220" rx="3" fill="url(#bar1)" opacity="0.6"/>
  <rect x="770" y="230" width="30" height="270" rx="3" fill="url(#bar2)" opacity="0.6"/>
  <rect x="830" y="260" width="30" height="240" rx="3" fill="url(#bar1)" opacity="0.6"/>
  <rect x="890" y="210" width="30" height="290" rx="3" fill="url(#bar2)" opacity="0.6"/>
  <!-- Grid -->
  <line x1="150" y1="500" x2="1050" y2="500" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="150" y1="400" x2="1050" y2="400" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="150" y1="300" x2="1050" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="150" y1="200" x2="1050" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="150" y1="100" x2="1050" y2="100" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Bottom bar -->
  <rect x="0" y="520" width="1200" height="110" fill="rgba(0,0,0,0.4)"/>
  <text x="600" y="565" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="bold" fill="white" text-anchor="middle">上市公司资金拆借与过桥融资</text>
  <text x="600" y="605" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" text-anchor="middle">行业资讯 | 宏都资本</text>
</svg>