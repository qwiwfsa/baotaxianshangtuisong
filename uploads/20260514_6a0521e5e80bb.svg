  <line x1="100" y1="100" x2="1100" y2="100" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Dollar sign -->
  <text x="600" y="130" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="rgba(255,255,255,0.05)" text-anchor="middle">￥</text>
