  <rect x="250" y="380" width="60" height="120" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="270" y="400" width="20" height="20" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="270" y="430" width="20" height="20" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="270" y="460" width="20" height="20" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="350" y="340" width="60" height="160" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="370" y="360" width="20" height="20" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="370" y="390" width="20" height="20" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="370" y="420" width="20" height="20" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="370" y="450" width="20" height="20" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="450" y="300" width="60" height="200" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="470" y="320" width="20" height="20" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="470" y="350" width="20" height="20" rx="2" fill="rgba(255,255,255,0.2)"/>
