<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a8e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Chart line -->
  <polyline points="100,450 200,380 300,420 400,250 500,300 600,180 700,220 800,150 900,200 1000,120 1100,160"
    fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <!-- Grid lines -->
  <line x1="100" y1="500" x2="1100" y2="500" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="100" y1="400" x2="1100" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="100" y1="300" x2="1100" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
