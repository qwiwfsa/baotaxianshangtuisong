  <rect x="470" y="410" width="20" height="20" rx="2" fill="rgba(255,255,255,0.2)"/>
  <!-- Title area -->
  <rect x="0" y="520" width="1200" height="110" fill="rgba(0,0,0,0.3)"/>
  <text x="600" y="570" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">企业摆账是什么意思？</text>
  <text x="600" y="610" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="rgba(255,255,255,0.7)" text-anchor="middle">一文详解摆账的操作流程与注意事项 | 行业资讯</text>
