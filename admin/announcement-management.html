<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站公告 - CMS管理后台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;min-height:100vh}
.cms-layout{display:flex;min-height:100vh}
.cms-sidebar{width:240px;background:#1e293b;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;color:#e2e8f0}
.cms-sidebar-header{padding:20px 24px;border-bottom:1px solid #334155}
.cms-sidebar-brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#fff}
.cms-sidebar-brand i{font-size:18px;color:#3b82f6}
.cms-sidebar-nav{padding:16px 0}
.cms-nav-section{margin-bottom:8px}
.cms-nav-title{padding:12px 24px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8}
.cms-nav-item{display:flex;align-items:center;gap:12px;padding:12px 24px;color:#cbd5e1;text-decoration:none;font-size:14px;transition:all .2s}
.cms-nav-item:hover{background:#334155;color:white}
.cms-nav-item.active{background:#334155;color:white;border-left:3px solid #3b82f6}
.cms-nav-item i{width:18px;text-align:center}
.cms-main{flex:1;margin-left:240px;padding:24px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;background:#fff;padding:16px 20px;border-radius:10px;border:1px solid #e2e8f0}
.toolbar h2{font-size:18px;font-weight:600;color:#1e293b;margin-right:auto}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;transition:all .15s}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-outline{background:#fff;color:#334155;border:1px solid #cbd5e1}.btn-outline:hover{background:#f8fafc}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
.btn-sm{padding:5px 10px;font-size:12px}
.table-wrap{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.table-wrap table{width:100%;border-collapse:collapse}
.table-wrap td,.table-wrap th{padding:10px 14px;font-size:12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-wrap th{background:#f8fafc;font-weight:600;color:#475569}
.table-wrap tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-pub{background:#dcfce7;color:#16a34a}.badge-draft{background:#fef3c7;color:#d97706}
.badge-top{background:#dbeafe;color:#2563eb}
.badge-expired{background:#fee2e2;color:#dc2626}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:640px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:16px}.modal label{display:block;font-size:12px;font-weight:500;color:#475569;margin-bottom:4px;margin-top:12px}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px}
.modal textarea{height:180px;resize:vertical;font-family:monospace}
.modal-btns{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:16px}
.pagination button{padding:5px 10px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;cursor:pointer;font-size:12px}
.pagination .pg-current{font-size:12px;color:#475569;padding:5px 8px}
.toast{position:fixed;top:20px;right:20px;z-index:400;padding:10px 18px;border-radius:8px;color:#fff;font-size:13px;display:none;animation:slideIn .3s}
.toast.success{background:#10b981}.toast.error{background:#ef4444}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;padding:50px;color:#94a3b8}.empty i{font-size:40px;margin-bottom:10px;display:block}
.filter-bar select{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px}
@media(max-width:768px){.cms-sidebar{display:none}.cms-main{margin-left:0}.modal .row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="cms-layout">
<aside class="cms-sidebar">
<div class="cms-sidebar-header"><div class="cms-sidebar-brand"><i class="fas fa-cog"></i><span>CMS管理后台</span></div></div>
<nav class="cms-sidebar-nav"><div class="cms-nav-section"><div class="cms-nav-title">菜单</div>
<a href="dashboard.html" class="cms-nav-item"><i class="fas fa-home"></i><span>仪表板</span></a>
<a href="logo-settings.html" class="cms-nav-item"><i class="fas fa-image"></i><span>Logo设置</span></a>
<a href="seo-settings.html" class="cms-nav-item"><i class="fas fa-search"></i><span>SEO设置</span></a>
<a href="case-management.html" class="cms-nav-item"><i class="fas fa-trophy"></i><span>案例管理</span></a>
<a href="page-manager.html" class="cms-nav-item"><i class="fas fa-list"></i><span>页面列表</span></a>
<a href="visual-page-builder.html" class="cms-nav-item"><i class="fas fa-pen-ruler"></i><span>页面设计</span></a>
<a href="visual-editor-v3.html" class="cms-nav-item"><i class="fas fa-paint-brush"></i><span>可视化编辑器</span></a>
<a href="nav-management.html" class="cms-nav-item"><i class="fas fa-bars"></i><span>导航菜单</span></a>
<a href="components/news/article-list.html" class="cms-nav-item"><i class="fas fa-newspaper"></i><span>文章管理</span></a>
<a href="faq-management.html" class="cms-nav-item"><i class="fas fa-question-circle"></i><span>FAQ管理</span></a>
<a href="components/tags/tag-list.html" class="cms-nav-item"><i class="fas fa-tags"></i><span>标签管理</span></a>
<a href="footer-manager.html" class="cms-nav-item"><i class="fas fa-list-alt"></i><span>页脚管理</span></a>
<a href="comment-management.html" class="cms-nav-item"><i class="fas fa-comments"></i><span>评价管理</span></a>
<a href="media-library.html" class="cms-nav-item"><i class="fas fa-photo-video"></i><span>媒体库</span></a>
<a href="friend-link-management.html" class="cms-nav-item"><i class="fas fa-link"></i><span>友情链接</span></a>
<a href="announcement-management.html" class="cms-nav-item active"><i class="fas fa-bullhorn"></i><span>网站公告</span></a>
<a href="fenzhan-management.html" class="cms-nav-item"><i class="fas fa-building"></i><span>城市分站</span></a>
<a href="fenzhan-template.html" class="cms-nav-item"><i class="fas fa-pen-ruler"></i><span>公共模板</span></a>
</div></nav>
</aside>
<main class="cms-main">
<div class="toolbar">
<h2>网站公告</h2>
<button class="btn btn-primary" onclick="openEdit(0)"><i class="fas fa-plus"></i>新建公告</button>
<button class="btn btn-outline btn-sm" onclick="loadList()"><i class="fas fa-sync-alt"></i></button>
<div class="filter-bar">
<select id="catFilter" onchange="loadList()"><option value="">全部分类</option><option value="general">通用</option><option value="notice">通知</option><option value="event">活动</option><option value="maintenance">维护</option></select>
<select id="statusFilter" onchange="loadList()"><option value="">全部状态</option><option value="1">已发布</option><option value="0">草稿</option></select>
<input id="searchAnn" placeholder="搜索标题..." style="padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;width:140px" oninput="debounce(loadList,400)">
</div>
</div>
<div class="table-wrap"><table><thead><tr>
<th width="50"><input type="checkbox" onchange="toggleAll(this)" id="selAll"></th>
<th>标题</th><th width="70">分类</th><th width="70">状态</th><th width="50">置顶</th><th width="60">阅读</th><th width="90">发布时间</th><th width="90">过期时间</th><th width="120">操作</th>
</tr></thead><tbody id="listBody"><tr><td colspan="9" style="text-align:center;padding:40px;color:#94a3b8">加载中...</td></tr></tbody></table></div>
<div class="pagination" id="pagination"></div>
<div class="batch-bar" id="batchBar" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 24px;border-radius:10px;z-index:200;gap:12px;align-items:center">
<span id="batchCount">已选0个</span>
<button onclick="batchAction('publish')" style="background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">发布</button>
<button onclick="batchAction('unpublish')" style="background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">下架</button>
<button onclick="batchAction('top')" style="background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">置顶</button>
<button onclick="batchAction('delete')" style="background:#ef4444;border-color:#ef4444;color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">删除</button>
<button onclick="cancelSelect()" style="background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">取消</button>
</div>
</main>
</div>
<div class="modal-overlay" id="modal"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>
var A='api/announcements/',page=1,sel=[],dt,editingId=0;
function G(id){return document.getElementById(id)}
function api(u,o){o=o||{};return fetch(A+u,o).then(function(r){return r.json()})}
function T(m,t){var e=G('toast');e.textContent=m;e.className='toast '+(t||'success');e.style.display='block';setTimeout(function(){e.style.display='none'},2500)}
function M(h){G('modalBox').innerHTML=h;G('modal').classList.add('show')}
function H(){G('modal').classList.remove('show')}
G('modal').addEventListener('click',function(e){if(e.target===this)H()})
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var dt;function debounce(f,t){clearTimeout(dt);dt=setTimeout(f,t||400)}

function loadList(){
var q='announcement-list.php?page='+page+'&limit=20';
var c=G('catFilter').value,s=G('statusFilter').value,sch=G('searchAnn').value;
if(c)q+='&category='+c;if(s)q+='&status='+s;
api(q).then(function(d){if(!d.success)return;var h=d.data.map(function(a){
var expired=a.expire_at&&new Date(a.expire_at)<new Date();
var stBadge=a.status==1?(expired?'<span class=\"badge badge-expired\">已过期</span>':'<span class=\"badge badge-pub\">已发布</span>'):'<span class=\"badge badge-draft\">草稿</span>';
var topBadge=a.priority>0?'<span class=\"badge badge-top\">置顶</span>':'';
var pubAt=a.publish_at?a.publish_at.substring(0,10):'-';
var expAt=a.expire_at?a.expire_at.substring(0,10):'-';
return'<tr><td><input type=checkbox value='+a.id+' onchange=updateSel()></td><td><strong>'+esc(a.title)+'</strong>'+(a.content_short?'<div style=font-size:11px;color:#94a3b8>'+esc(a.content_short)+'</div>':'')+'</td><td>'+esc(a.category)+'</td><td>'+stBadge+' '+topBadge+'</td><td>'+a.priority+'</td><td>'+a.view_count+'</td><td>'+pubAt+'</td><td>'+expAt+'</td><td><button class=\"btn btn-sm btn-outline\" onclick=openEdit('+a.id+')><i class=fas fa-pen></i></button> <button class=\"btn btn-sm btn-danger\" onclick=del('+a.id+')><i class=fas fa-trash></i></button></td></tr>'
}).join('');G('listBody').innerHTML=h||'<tr><td colspan=9 style=text-align:center;padding:40px;color:#94a3b8>暂无公告</td></tr>';renderPg(d)})}
function renderPg(d){var e=G('pagination');if(d.pages<=1){e.innerHTML='';return}
e.innerHTML='<button onclick=page=1;loadList()'+(d.page<=1?' disabled':'')+'><i class=fas fa-angle-double-left></i></button><button onclick=page='+(d.page-1)+';loadList()'+(d.page<=1?' disabled':'')+'><i class=fas fa-angle-left></i></button><span class=pg-current>'+d.page+'/'+d.pages+'</span><button onclick=page='+(d.page+1)+';loadList()'+(d.page>=d.pages?' disabled':'')+'><i class=fas fa-angle-right></i></button><button onclick=page='+d.pages+';loadList()'+(d.page>=d.pages?' disabled':'')+'><i class=fas fa-angle-double-right></i></button>'}

function getSel(){var ids=[];document.querySelectorAll('#listBody input[type=checkbox]:checked').forEach(function(c){ids.push(parseInt(c.value))});return ids}
function updateSel(){var ids=getSel();var b=G('batchBar');b.style.display=ids.length?'flex':'none';G('batchCount').textContent='已选'+ids.length+'个'}
function toggleAll(cb){document.querySelectorAll('#listBody input[type=checkbox]').forEach(function(c){c.checked=cb.checked});updateSel()}
function cancelSelect(){document.querySelectorAll('#listBody input[type=checkbox]').forEach(function(c){c.checked=false});updateSel()}

function openEdit(id){
editingId=id;
if(id>0){api('announcement-get.php?id='+id).then(function(d){if(d.success)showForm(d.data)})}else{showForm({id:0,title:'',content:'',status:1,priority:0,category:'general',publish_at:'',expire_at:''})}}
function showForm(a){
M('<h3>'+(a.id?'编辑公告':'新建公告')+'</h3>'+
'<label>标题</label><input id=afTitle value=\"'+esc(a.title||'')+'\">'+
'<div class=row><div><label>分类</label><select id=afCat><option value=general'+(a.category=='general'?' selected':'')+'>通用</option><option value=notice'+(a.category=='notice'?' selected':'')+'>通知</option><option value=event'+(a.category=='event'?' selected':'')+'>活动</option><option value=maintenance'+(a.category=='maintenance'?' selected':'')+'>维护</option></select></div>'+
'<div><label>状态</label><select id=afStatus><option value=1'+(a.status==1?' selected':'')+'>发布</option><option value=0'+(a.status==0?' selected':'')+'>草稿</option></select></div></div>'+
'<div class=row><div><label>置顶优先级</label><input id=afPriority type=number value=\"'+a.priority+'\"></div><div></div></div>'+
'<div class=row><div><label>定时发布</label><input id=afPubAt type=datetime-local value=\"'+(a.publish_at?a.publish_at.substring(0,16):'')+'\"></div><div><label>过期时间</label><input id=afExpAt type=datetime-local value=\"'+(a.expire_at?a.expire_at.substring(0,16):'')+'\"></div></div>'+
'<label>内容 <span style=font-weight:400;color:#94a3b8>(支持HTML)</span></label><textarea id=afContent>'+esc(a.content||'')+'</textarea>'+
'<div class=modal-btns><button class=\"btn btn-outline\" onclick=H()>取消</button><button class=\"btn btn-primary\" onclick=save()>保存</button></div>')}
function save(){
var d={id:editingId,title:G('afTitle').value,content:G('afContent').value,category:G('afCat').value,status:parseInt(G('afStatus').value),priority:parseInt(G('afPriority').value)||0,publish_at:G('afPubAt').value||null,expire_at:G('afExpAt').value||null};
api('announcement-save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(d2){if(d2.success){T('已保存');H();loadList()}})}
function del(id){if(!confirm('确定删除？'))return;api('announcement-delete.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(function(r){return r.json()}).then(function(d){if(d.success){T('已删除');loadList()}})}

function batchAction(act){var ids=getSel();if(!ids.length)return;if(act==='delete'&&!confirm('确定删除'+ids.length+'条？'))return;
api('announcement-batch.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:ids,action:act})}).then(function(r){return r.json()}).then(function(d){if(d.success){T('完成');cancelSelect();loadList()}})}

loadList();
</script>
</body>
</html>
